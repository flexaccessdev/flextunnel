[workspace]
members = ["crates/*"]
resolver = "3"
# A bare `cargo build` skips only the iOS staticlib (built explicitly via
# build-ios.sh with `-p flextunnel-ffi`); `--workspace` still covers everything
# for clippy/test.
default-members = [
    "crates/flextunnel-core",
    "crates/flextunnel-cli",
]

[workspace.package]
version = "0.0.92"
edition = "2024"
description = "SOCKS5/HTTP proxy and port forwards over QUIC — split tunnel via iroh P2P"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
askama = "0.16.1"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
# Shared FlexAccess auth key format (`ed25519-sec:` / `ed25519-pub:` tokens,
# key files, authorized-keys parsing). Key generation is the standalone
# `flexaccess-keys` CLI; this library only parses, signs, and verifies.
flexaccess-keys = { git = "https://github.com/flexaccessdev/flexaccess-keys", tag = "v0.0.2", default-features = false }
futures = "0.3"
ipnetwork = "0.21"
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
# Shared iroh transport layer (relay config + probe, endpoint building and
# rebuild, home-relay watchdog, endpoint-bound auth transcript). `mdns` turns on
# local-network discovery on every endpoint (compiled out on iOS by the crate).
flexaccess-iroh = { git = "https://github.com/flexaccessdev/flexaccess-iroh", tag = "v0.0.13", features = ["mdns"] }
iroh = "1.4.1"
# Held at 0.2.189: 0.2.190 gates `in6_ifreq` to macOS only, but netdev
# (iroh → netwatch) uses it on every Apple target, which breaks the iOS build.
# Lift once netdev or libc fixes it (netdev PR shellrow/netdev#192, still
# unmerged as of netdev 0.46.3).
libc = "=0.2.189"
log = "0.4"
n0-future = "0.3"
rand = "0.10"
ratatui = "0.30"
# Custom-relay `/healthz` checks (see `transport::paths`). `rustls-no-provider`
# matches the exact reqwest feature iroh already enables, so this adds no new TLS
# backend (no openssl / aws-lc); the process installs a ring crypto provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
url = "2"
tempfile = "3.27.0"
flextunnel-core = { path = "crates/flextunnel-core" }

# block 0.1.6 (iced → wgpu → metal, macOS only) with its future-incompat
# "static of uninhabited type" soundness bug fixed — see vendor/block/README.md.
[patch.crates-io]
block = { path = "vendor/block" }

# Profiles are only honored in the workspace root manifest.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
