[workspace]
members = ["crates/*"]
resolver = "3"
# A bare `cargo build` skips only the iOS staticlib (built explicitly via
# build-ios.sh with `-p flextunnel-ffi`); `--workspace` still covers everything
# for clippy/test.
default-members = [
    "crates/flextunnel-core",
    "crates/flextunnel-cli",
]

[workspace.package]
version = "0.0.112"
edition = "2024"
description = "SOCKS5/HTTP proxy and port forwards over QUIC — split tunnel via iroh P2P"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
askama = "0.16.1"
base64 = "0.23"
# The chunk type of iroh's QUIC streams (`write_chunk` / `read_many_chunks`).
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
env_logger = "0.11"
# Shared FlexAccess auth key format (`ed25519-sec:` / `ed25519-pub:` tokens,
# key files, authorized-keys parsing). Key generation is the standalone
# `flexaccess-keys` CLI; this library only parses, signs, and verifies.
flexaccess-keys = { git = "https://github.com/flexaccessdev/flexaccess-keys", tag = "v0.0.2", default-features = false }
futures = "0.3"
ipnetwork = "0.21"
# Shared iroh transport layer (relay config + probe, endpoint building and
# rebuild, home-relay watchdog, endpoint-bound auth transcript). `mdns` turns on
# local-network discovery on every endpoint (compiled out on iOS by the crate);
# `relay-health` is the custom-relay `/healthz` check the status views show
# (see `transport::paths`).
flexaccess-iroh = { git = "https://github.com/flexaccessdev/flexaccess-iroh", tag = "v0.0.29", features = ["mdns", "relay-health"] }
iroh = "1.5.0"
libc = "0.2"
log = "0.4"
n0-future = "0.3"
rand = "0.10"
ratatui = "0.30"
# The ring crypto provider handed to iroh's endpoint builder.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
url = "2"
tempfile = "3.27.0"
flextunnel-core = { path = "crates/flextunnel-core" }

[patch.crates-io]
# block 0.1.6 (iced → wgpu → metal, macOS only) with its future-incompat
# "static of uninhabited type" soundness bug fixed — see vendor/block/README.md.
block = { path = "vendor/block" }

# Forks of the transport stack, on flextunnel's own branches (`flextunnel-*`,
# named for the upstream release each is based on). They began at the commits
# of the branches ezvpn runs on and move separately from them. Applied as patches rather than git dependencies so every crate in the
# graph (`flexaccess-iroh`, iroh itself, the mDNS address lookup) resolves to
# the same package (see flexaccess-iroh's README, "Consumers on a fork of
# iroh"). Cargo.lock pins each tested branch commit. What they do for the data
# path, and what each measured, is in docs/benchmarks.md.
#
# Forked from netwatch v0.20.2 (n0-computer/net-tools). Opens a connected UDP
# socket per busy peer beside the unconnected main socket, sharing its port
# with SO_REUSEPORT. On Linux that keeps a peer's datagrams on one NIC transmit
# queue: an unconnected socket's queue follows the sending thread's CPU on a
# multi-queue NIC, which reorders the connection's packets, and QUIC reads the
# reordering as loss. On Apple platforms it skips the per-datagram connect and
# disconnect XNU charges every send that names a destination. It also sizes
# the UDP socket buffers past net.core.rmem_max/wmem_max when the process
# holds CAP_NET_ADMIN, which flextunnel normally does not (docs/benchmarks.md
# has the sysctl).
netwatch = { git = "https://github.com/flexaccessdev/net-tools.git", branch = "flextunnel-0.20.2" }
# Forked from noq v1.5.0. Packs up to 32 datagrams into one GSO send where
# upstream stops at 10, releases the connection lock across each UDP send
# (except on Windows), adds `UdpSocketState::send_connected` for the netwatch
# fork's peer sockets on Apple platforms, stamps each received batch as it is
# read, and judges a loss burst against the newest delivery of that burst's own
# size before calling it an MTU black hole: upstream took congestion loss for
# one and dropped the path MTU to 1200 for a minute. It also grows a stream's
# receive window with its reader (`max_stream_receive_window`, out of a
# `stream_receive_window_budget` per connection), where upstream gives every
# stream of a connection one fixed window: `transport/mod.rs` sets the three
# sizes and says why. All three crates come from the fork so the graph holds a
# single `noq-udp`.
noq = { git = "https://github.com/flexaccessdev/noq.git", branch = "flextunnel-1.5.0" }
noq-proto = { git = "https://github.com/flexaccessdev/noq.git", branch = "flextunnel-1.5.0" }
noq-udp = { git = "https://github.com/flexaccessdev/noq.git", branch = "flextunnel-1.5.0" }
# Forked from iroh v1.5.0. Keeps a transmit a UDP socket could not take, so noq
# retries it instead of counting a local discard as sent, and puts the noq
# fork's receive window growth settings on the transport config builder.
# `iroh-base` comes from the fork with it: the mDNS address lookup depends on
# that crate directly, and from crates.io its key types would not be iroh's.
iroh = { git = "https://github.com/flexaccessdev/iroh.git", branch = "flextunnel-1.5.0" }
iroh-base = { git = "https://github.com/flexaccessdev/iroh.git", branch = "flextunnel-1.5.0" }

# Profiles are only honored in the workspace root manifest.
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
